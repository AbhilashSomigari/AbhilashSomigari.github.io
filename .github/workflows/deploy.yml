name: Sync & Deploy to GitHub Pages

# One pipeline for every trigger:
# - push to main:        sync GitHub metadata, verify, build, deploy
# - daily schedule:      sync; deploy only if repository metadata changed
# - manual (Run workflow): sync and deploy now
#
# Loop safety: the metadata snapshot is committed with GITHUB_TOKEN, and
# GitHub never starts new workflow runs from GITHUB_TOKEN pushes. The sync
# script also excludes this repo, whose own pushed_at changes on every commit.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *' # daily, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the refreshed metadata snapshot
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync GitHub repository metadata
        id: sync
        # A failed sync (API outage, rate limit) never blocks a deploy: the
        # script leaves the last committed snapshot untouched.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github.mjs

      - name: Decide whether to deploy
        id: plan
        run: |
          if git diff --quiet -- src/data/generated/github.json; then changed=false; else changed=true; fi
          deploy=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$changed" = "false" ]; then deploy=false; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "Snapshot changed: $changed · Deploy: $deploy · Sync outcome: ${{ steps.sync.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        if: steps.plan.outputs.deploy == 'true'
        run: npm ci

      - name: Lint
        if: steps.plan.outputs.deploy == 'true'
        run: npm run lint

      - name: Test
        if: steps.plan.outputs.deploy == 'true'
        run: npm test

      - name: Build
        if: steps.plan.outputs.deploy == 'true'
        run: npm run build

      - name: Commit refreshed snapshot
        # Only after lint/test/build pass, so a bad snapshot never lands.
        if: steps.plan.outputs.changed == 'true' && steps.plan.outputs.deploy == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated/github.json
          git commit -m "chore(data): sync GitHub repository metadata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Setup Pages
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
