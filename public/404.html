<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Abhilash Somigari</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0a0a0b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        text-align: center;
        padding: 1.5rem;
      }
      .code {
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
        color: #7dd3c0;
        font-size: 0.9rem;
        letter-spacing: 0.08em;
      }
      h1 { font-size: 1.5rem; margin: 0; font-weight: 600; }
      p { color: #a1a1aa; margin: 0; max-width: 32ch; }
      a {
        color: #f4f4f5;
        border: 1px solid #2a2a30;
        padding: 0.6rem 1.1rem;
        border-radius: 8px;
        text-decoration: none;
        margin-top: 0.5rem;
        font-size: 0.9rem;
      }
      a:hover { border-color: #7dd3c0; color: #7dd3c0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="code">404 / NOT_FOUND</div>
      <h1>This page doesn't exist.</h1>
      <p>The page you're looking for was moved or never existed.</p>
      <a href="/">Back to the portfolio</a>
    </div>
  </body>
</html>
